name: Update MultiGP events

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/events.json
      - docs/standings.json
  schedule:
    - cron: "0 22 */2 * *"
      timezone: "America/Vancouver"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Fetch upcoming events
        run: bash scripts/update-events.sh

      - name: Fetch 200G MAX standings
        run: python3 scripts/update-standings.py
        continue-on-error: true

      - name: Commit changes
        run: |
          if git diff --quiet -- docs/events.json docs/standings.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json docs/standings.json
          git commit -m "Update MultiGP events and standings"
          git push
