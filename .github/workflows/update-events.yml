name: Update MultiGP events

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Fetch upcoming events
        run: bash scripts/update-events.sh

      - name: Commit changes
        run: |
          if git diff --quiet -- docs/events.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/events.json
          git commit -m "Update MultiGP events"
          git push
