name: Update MultiGP events

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/data/events.json
      - docs/data/standings-2024-2025.json
      - docs/data/standings-2026-2027.json
  schedule:
    - cron: "0 22 */2 * *"
      timezone: "America/Vancouver"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    env:
      MULTIGP_API_KEY: ${{ secrets.MULTIGP_API_KEY }}
      MULTIGP_SESSION_ID: ${{ secrets.MULTIGP_SESSION_ID }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Fetch upcoming events
        run: bash docs/scripts/update-events.sh

      - name: Refresh standings after completed series races
        run: python3 docs/scripts/update-standings.py

      - name: Commit changes
        run: |
          if git diff --quiet -- docs/data/events.json docs/data/standings-2024-2025.json docs/data/standings-2026-2027.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/events.json docs/data/standings-2024-2025.json docs/data/standings-2026-2027.json
          git commit -m "Update MultiGP events and standings"
          git push
